<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Dashboard - B.O.P.E</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="auth.js" data-guard="admin"></script>
</head>
<body>
<header>
  <a class="logo" href="index.html">B.O.P.E <span>Cursos</span></a>
  <nav aria-label="Principal"><a href="index.html">Início</a><a href="index.html#cursos">Cursos</a></nav>
  <div class="userbar" id="userbar"></div>
</header>

<main class="wrap">
  <nav id="tabs" class="tabs" data-active="dashboard" aria-label="Seções do painel administrativo"></nav>
  <h1>DASHBOARD</h1>
  <p class="lead">Instrutores que mais emitiram certificados.</p>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>

  <ul class="kpis" id="kpis"></ul>

  <section class="panel" aria-labelledby="h-rank">
    <h2 id="h-rank">Ranking de instrutores</h2>
    <div class="filterbar">
      <div class="field">
        <label for="periodo">Período</label>
        <select id="periodo">
          <option value="semana">Semana (últimos 7 dias)</option>
          <option value="mes" selected>Mês (últimos 30 dias)</option>
          <option value="ano">Ano (últimos 365 dias)</option>
        </select>
      </div>
      <div class="period" id="periodTxt"></div>
    </div>
    <ol class="rank" id="rank" aria-label="Instrutores por número de certificados emitidos"></ol>
    <p class="empty" id="empty" hidden></p>
    <p class="note-line" id="semInstr"></p>
  </section>
</main>

<footer>Todos os direitos reservados a B.O.P.E ©copyright 2026</footer>

<script>
Auth.ready.then(function () {
  if (!Auth.user) return;
  var $ = function (id) { return document.getElementById(id); }, h = Auth.h;
  var DIAS = { semana: 7, mes: 30, ano: 365 };

  function shift(iso, n) {
    var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2] + n);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function plural(n, s, p) { return n + ' ' + (n === 1 ? s : p); }

  function render() {
    var fim = Auth.today(), ini = shift(fim, -(DIAS[$('periodo').value] - 1));
    $('periodTxt').textContent = 'De ' + Auth.fmtDate(ini) + ' a ' + Auth.fmtDate(fim);

    var users = Auth.listUsers(), byId = {};
    users.forEach(function (u) { byId[u.id.toLowerCase()] = u; });

    /* conta pela data de emissão (certificados antigos, sem esse dado, usam a data de conclusão) */
    var inPeriod = Auth.listCerts().filter(function (c) { var ref = c.emitidoEm || c.data; return ref >= ini && ref <= fim; });
    var counts = {}, semInstr = 0;
    inPeriod.forEach(function (c) {
      if (!c.instrutorId) { semInstr++; return; }
      var k = c.instrutorId.toLowerCase();
      if (!counts[k]) counts[k] = { n: 0, nome: (byId[k] ? byId[k].nome : c.instrutorNome) || c.instrutorId };
      counts[k].n++;
    });
    var rows = Object.keys(counts).map(function (k) { return counts[k]; })
      .sort(function (a, b) { return b.n - a.n || a.nome.localeCompare(b.nome, 'pt-BR'); });

    var comInstr = inPeriod.length - semInstr;
    var kp = $('kpis'); kp.textContent = '';
    [[inPeriod.length, 'Certificados no período'], [rows.length, 'Instrutores com emissões'], [rows.length ? rows[0].nome : '—', 'Instrutor destaque']].forEach(function (k) {
      kp.appendChild(h('li', null, h('div', { 'class': 'v', text: String(k[0]), style: typeof k[0] === 'string' ? 'font-size:1.4rem' : '' }), h('div', { 'class': 'l', text: k[1] })));
    });

    var ol = $('rank'); ol.textContent = '';
    var max = rows.length ? rows[0].n : 1;
    rows.forEach(function (r, i) {
      ol.appendChild(h('li', null,
        h('span', { 'class': 'pos', text: (i + 1) + 'º' }),
        h('span', { 'class': 'name', text: r.nome }),
        h('div', { 'class': 'track', 'aria-hidden': 'true' }, h('div', { 'class': 'fill', style: 'width:' + (r.n / max * 100) + '%' })),
        h('span', { 'class': 'num', text: String(r.n), 'aria-label': plural(r.n, 'certificado', 'certificados') })));
    });
    var em = $('empty');
    em.hidden = rows.length > 0;
    em.textContent = rows.length ? '' : 'Nenhum certificado com instrutor responsável neste período.';
    $('semInstr').textContent = semInstr
      ? plural(semInstr, 'certificado emitido', 'certificados emitidos') + ' no período sem instrutor responsável (não aparece no ranking).'
      : '';
    return comInstr;
  }

  $('periodo').addEventListener('change', function () {
    render();
    var l = $('live'); l.textContent = ''; setTimeout(function () { l.textContent = 'Ranking atualizado: ' + $('periodo').selectedOptions[0].text + '.'; }, 50);
  });
  render();
});
</script>
</body>
</html>
